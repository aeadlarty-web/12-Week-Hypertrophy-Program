<style>
:root{
  --navy:#161F35; --navy2:#1E2A47; --navy3:#253250;
  --amber:#D9A441; --cream:#EDE7DA; --muted:#8B93A7;
  --green:#5FA876; --line:#2A3654; --red:#B0452E;
}
*{box-sizing:border-box}
html,body{margin:0;background:#10172a;color:var(--cream);font-family:Inter,sans-serif}
body{min-height:100vh}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--navy);padding-bottom:92px}
.disp{font-family:'Bebas Neue',sans-serif;letter-spacing:.04em}
button,select,input{font-family:inherit}
button{cursor:pointer}
.tap:active{transform:scale(.97)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:#33405F;border-radius:5px}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom)}
.glass{background:rgba(30,42,71,.82);backdrop-filter:blur(12px)}
.card{background:var(--navy2);border:1px solid var(--line);border-radius:16px}
.progress{height:7px;background:#33405F;border-radius:99px;overflow:hidden}
.progress>div{height:100%;background:var(--green);border-radius:99px;transition:width .25s}
.nav-btn{color:var(--muted)}
.nav-btn.active{color:var(--amber)}
.smallcaps{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.metric{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:13px}
input:focus,select:focus{outline:2px solid rgba(217,164,65,.45);outline-offset:1px}
.set-dot{font-size:29px;line-height:1}
.badge{border:1px solid rgba(217,164,65,.55);background:rgba(217,164,65,.10);color:var(--amber)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{width:100%;max-width:520px;max-height:86vh;overflow:auto;background:var(--navy2);border:1px solid var(--line);border-radius:20px 20px 0 0}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:80;background:#0f1729;border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
</style>
</head>

function weekInfo(w){
 if(w<=4)return{phaseKey:"f",idx:w-1,phaseName:"Foundation",desc:"Technique, capacity & consistency"};
 if(w<=8)return{phaseKey:"o",idx:w-5,phaseName:"Overload",desc:"Progressive overload & harder sets"};
 if(w<=11)return{phaseKey:"p",idx:w-9,phaseName:"Peak",desc:"High effort & controlled intensity"};
 return{phaseKey:"d",idx:0,phaseName:"Deload",desc:"Recovery & resensitization"};
}
function weekNoteText(w,p){
 if(p==="f")return"Build technique and capacity. When every set reaches the top of the rep target with good form, add weight next session.";
 if(p==="o"&&w<=6)return"RIR tightens to 1. This should feel noticeably harder than Foundation.";
 if(p==="o")return"On isolation work, use a drop set on the final set: hit the target, reduce load ~20%, then continue close to failure.";
 if(p==="p")return"Take the last set of isolation exercises to true technical failure. Use only one intensity technique per exercise.";
 return"Recovery week. Use roughly 60% of your current top-set load and stop every set 3–4 reps short of failure.";
}
function isSuperset(code){return/[A-Z]$/.test(code)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

/* =========================
   STORAGE / STATE
========================= */
const LS={
 get(k,f){try{const v=localStorage.getItem(k);return v===null?f:JSON.parse(v)}catch(e){return f}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
 del(k){try{localStorage.removeItem(k)}catch(e){}}
};
let state={
 week:LS.get("hl:week",1),
 workoutKey:LS.get("hl:workout","upperA"),
 openCue:null,
 timer:{running:false,seconds:0,total:0}
};
let timerHandle=null;

function getProgress(w,k){return LS.get(`hl:progress:${w}:${k}`,{})}
function setProgress(w,k,d){LS.set(`hl:progress:${w}:${k}`,d)}
function isComplete(w,k){return!!LS.get(`hl:completed:${w}:${k}`,false)}
function setComplete(w,k){LS.set(`hl:completed:${w}:${k}`,new Date().toISOString())}
function ensureProgressShape(w,workout){
 const wi=weekInfo(w),data=getProgress(w,workout.key);let changed=false;
 workout.exercises.forEach(e=>{
  const n=e.sets[wi.phaseKey];
  if(!data[e.code]){data[e.code]={checks:Array(n).fill(false),weight:""};changed=true}
  else if(data[e.code].checks.length!==n){
   const old=data[e.code].checks;
   data[e.code].checks=Array.from({length:n},(_,i)=>old[i]||false);changed=true;
  }
 });
 if(changed)setProgress(w,workout.key,data);
 return data;
}
function allWorkoutStats(w,k){
 const workout=WORKOUTS.find(x=>x.key===k),wi=weekInfo(w),data=ensureProgressShape(w,workout);
 const total=workout.exercises.reduce((s,e)=>s+e.sets[wi.phaseKey],0);
 const done=workout.exercises.reduce((s,e)=>s+data[e.code].checks.filter(Boolean).length,0);
 return {total,done,pct:total?Math.round(done/total*100):0,complete:isComplete(w,k)};
}
function allProgramStats(){
 let total=0,done=0,workoutsDone=0;
 for(let w=1;w<=12;w++)WORKOUTS.forEach(k=>{
  const s=allWorkoutStats(w,k.key);total+=s.total;done+=s.done;if(s.complete)workoutsDone++;
 });
 return {total,done,pct:total?Math.round(done/total*100):0,workoutsDone};
}

/* =========================
   ACTIONS
========================= */
function goWeek(d){state.week=Math.max(1,Math.min(12,state.week+d));LS.set("hl:week",state.week);state.openCue=null;render()}
function setWeekDirect(v){state.week=Math.max(1,Math.min(12,+v));LS.set("hl:week",state.week);state.openCue=null;render()}
function setWorkout(k){state.workoutKey=k;LS.set("hl:workout",k);state.openCue=null;render()}
function toggleCue(c){state.openCue=state.openCue===c?null:c;render()}
function setWeight(code,val){
 const workout=WORKOUTS.find(w=>w.key===state.workoutKey),data=ensureProgressShape(state.week,workout);
 data[code].weight=val;setProgress(state.week,workout.key,data);
}
function toggleSet(code,idx,rest){
 const workout=WORKOUTS.find(w=>w.key===state.workoutKey),data=ensureProgressShape(state.week,workout);
 const on=!data[code].checks[idx];data[code].checks[idx]=on;setProgress(state.week,workout.key,data);
 if(on)startTimer(rest);
 render();
}
function markComplete(){
 setComplete(state.week,state.workoutKey);
 showToast(`${WORKOUTS.find(w=>w.key===state.workoutKey).name} marked complete`);
 render();
}
/* ---- Rest-timer sound: Web Audio beep, unlocked on the same tap that starts the timer ---- */
let audioCtx=null;
function ensureAudio(){
 if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; } }
 if(audioCtx && audioCtx.state==="suspended"){ audioCtx.resume().catch(()=>{}); }
}
function beepOnce(freq,startAt,dur){
 if(!audioCtx)return;
 try{
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type="sine"; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,startAt);
  g.gain.exponentialRampToValueAtTime(0.35,startAt+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,startAt+dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(startAt); o.stop(startAt+dur+0.02);
 }catch(e){}
}
function playRestDoneSound(){
 if(!audioCtx)return;
 const t=audioCtx.currentTime;
 beepOnce(880,t,0.28);
 beepOnce(1175,t+0.18,0.3);
}
function startTimer(sec){ensureAudio();clearTimeout(timerHandle);state.timer={running:true,seconds:sec,total:sec};tickTimer();render()}
function pauseTimer(){
 clearTimeout(timerHandle);
 if(state.timer.running){state.timer.running=false;render()}
}
function resumeTimer(){
 if(state.timer.seconds>0 && !state.timer.running){ensureAudio();state.timer.running=true;tickTimer();render()}
}
function adjustTimer(delta){
 state.timer.seconds=Math.max(0,state.timer.seconds+delta);
 state.timer.total=Math.max(state.timer.total,state.timer.seconds);
 if(state.timer.seconds===0)stopTimer(); else render();
}
function skipTimer(){stopTimer()}
function timerBarAdvanced(){
 const t=state.timer;
 if(!t.running && !t.seconds) return `<div class="rounded-xl p-3 mt-4" style="background:var(--navy2);border:1px solid var(--line)"><div class="flex items-center justify-between"><div><div class="mini-label">Rest timer</div><div class="text-xs mt-1" style="color:var(--muted)">Tap a duration to start</div></div><div class="flex gap-1">${[45,60,75,90,120].map(x=>`<button class="secondary" onclick="startTimer(${x})">${x}s</button>`).join('')}</div></div></div>`;
 const pct=t.total?Math.round(t.seconds/t.total*100):0;
 return `<div class="rounded-xl p-3 mt-4" style="background:var(--navy2);border:1px solid var(--amber)"><div class="flex items-center justify-between gap-3"><div><div class="mini-label" style="color:var(--amber)">REST TIMER</div><div class="disp text-3xl">${t.seconds}s</div></div><div class="flex gap-1 flex-wrap justify-end"><button class="secondary" onclick="adjustTimer(-15)">−15</button><button class="secondary" onclick="adjustTimer(30)">+30</button><button class="secondary" onclick="${t.running?'pauseTimer()':'resumeTimer()'}">${t.running?'Pause':'Resume'}</button><button class="secondary" onclick="skipTimer()">Skip</button></div></div><div class="progress-track mt-3"><div class="progress-fill" style="width:${pct}%"></div></div></div>`;
}
function renderTimerOnly(){
 const el=document.getElementById("advancedTimer");
 if(el)el.outerHTML=timerBarAdvanced().replace(/^<div/,'<div id="advancedTimer"');
}
function tickTimer(){
 clearTimeout(timerHandle);
 timerHandle=setTimeout(()=>{
  if(state.timer.seconds>1){state.timer.seconds--;renderTimerOnly();tickTimer()}
  else{state.timer.running=false;state.timer.seconds=0;try{navigator.vibrate&&navigator.vibrate([180,80,180])}catch(e){}playRestDoneSound();showToast("Rest complete");render()}
 },1000);
}
function showToast(msg){state.toast=msg;setTimeout(()=>{state.toast=null;render()},1800)}
function resetCurrentWorkout(){
 const w=WORKOUTS.find(x=>x.key===state.workoutKey);
 if(!confirm(`Reset all logged sets and weights for Week ${state.week} · ${w.name}? This can't be undone.`))return;
 const k=`hl:progress:${state.week}:${state.workoutKey}`;LS.del(k);LS.del(`hl:completed:${state.week}:${state.workoutKey}`);
 showToast("Current workout reset");render();
}
function resetAll(){
 if(!confirm("Reset all workout progress, weights and completion history?"))return;
 Object.keys(localStorage).filter(k=>k.startsWith("hl:")).forEach(k=>localStorage.removeItem(k));
 state.week=1;state.workoutKey="upperA";state.openCue=null;
 advState={tab:"home",bodyweight:"",measurements:[],notes:{},sessionRPE:{},history:[],prs:{}};
 showToast("All progress reset");render();
}

</script>

<script>
/* ---- Advanced tracking layer ---- */
const ADV = {
  get(k,f){try{const v=localStorage.getItem(k);return v===null?f:JSON.parse(v)}catch(e){return f}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let advState = {
  tab: ADV.get("hl:tab","home"),
  bodyweight: ADV.get("hl:bodyweight",""),
  measurements: ADV.get("hl:measurements",[]),
  notes: ADV.get("hl:notes",{}),
  sessionRPE: ADV.get("hl:rpe",{}),
  history: ADV.get("hl:history",[]),
  prs: ADV.get("hl:prs",{})
};

function saveAdv(){ADV.set("hl:bodyweight",advState.bodyweight);ADV.set("hl:measurements",advState.measurements);ADV.set("hl:notes",advState.notes);ADV.set("hl:rpe",advState.sessionRPE);ADV.set("hl:history",advState.history);ADV.set("hl:prs",advState.prs);ADV.set("hl:tab",advState.tab)}

function switchTab(t){advState.tab=t;saveAdv();renderAdvanced()}
function logBodyweight(v){advState.bodyweight=v;saveAdv();renderAdvanced()}
function addMeasurement(){
  const d=document.getElementById("mDate")?.value||new Date().toISOString().slice(0,10);
  const w=document.getElementById("mWeight")?.value||"";
  const wa=document.getElementById("mWaist")?.value||"";
  if(!w && !wa)return;
  advState.measurements.unshift({date:d,weight:w,waist:wa});
  saveAdv();renderAdvanced();
}
function removeMeasurement(i){advState.measurements.splice(i,1);saveAdv();renderAdvanced()}
function setSessionNote(v){advState.notes[`${state.week}:${state.workoutKey}`]=v;saveAdv()}
function setRPE(v){advState.sessionRPE[`${state.week}:${state.workoutKey}`]=v;saveAdv()}
function recordCompletedSession(){
  const workout=WORKOUTS.find(w=>w.key===state.workoutKey);
  const data=ensureProgressShape(state.week,workout), wi=weekInfo(state.week);
  const sets=workout.exercises.reduce((s,e)=>s+e.sets[wi.phaseKey],0);
  const done=workout.exercises.reduce((s,e)=>s+data[e.code].checks.filter(Boolean).length,0);
  const key=`${state.week}:${state.workoutKey}`;
  const existing=advState.history.find(x=>x.key===key);
  const item={key,date:new Date().toISOString(),week:state.week,workout:workout.name,sets,done,rpe:advState.sessionRPE[key]||""};
  if(existing)Object.assign(existing,item);else advState.history.unshift(item);
  saveAdv();
}

function calculateStats(){
  const all=advState.history;
  const sessions=all.length;
  const sets=all.reduce((a,x)=>a+x.done,0);
  let streak=0;
  const dates=[...new Set(all.map(x=>new Date(x.date).toDateString()))];
  for(let i=0;i<dates.length;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    if(dates.includes(d.toDateString()))streak++;else break;
  }
  return {sessions,sets,streak};
}
function suggestedIncrement(range){
  return (range==="6-10"||range==="8-12"||range==="10-12")?5:2.5;
}
function getExerciseRecommendation(e,data,wi,week,workoutKey){
  const p=data[e.code], n=e.sets[wi.phaseKey];
  const doneCount=p.checks.filter(Boolean).length;
  const reps=repLabel(e.range,wi.phaseKey,wi.idx);
  if(doneCount<n)return `Finish ${n-doneCount} remaining set${n-doneCount===1?"":"s"}.`;
  const isBlockStart=(week===1||week===5||week===9);
  if(isBlockStart){
    if(p.weight==="")return `New exercise this phase — find a comfortable weight for ${reps} reps at RIR ${e.rir[wi.phaseKey]}, then log it.`;
    return `Target ${reps} reps at RIR ${e.rir[wi.phaseKey]}.`;
  }
  const prevData=getProgress(week-1,workoutKey);
  const prevP=prevData[e.code];
  if(!prevP || prevP.weight===""){
    return p.weight===""?"Log your working weight for next time.":`Target ${reps} reps at RIR ${e.rir[wi.phaseKey]}.`;
  }
  const prevWeight=parseFloat(prevP.weight);
  const prevAllDone=prevP.checks.length && prevP.checks.every(Boolean);
  if(isNaN(prevWeight))return `Target ${reps} reps at RIR ${e.rir[wi.phaseKey]}.`;
  if(prevAllDone){
    const inc=suggestedIncrement(e.range);
    const next=(prevWeight+inc).toFixed(1).replace(/\.0$/,"");
    return `Last time: ${prevP.weight} lb, all sets completed. Try ${next} lb today for ${reps} reps.`;
  }
  return `Last time: ${prevP.weight} lb, sets incomplete. Repeat ${prevP.weight} lb and focus on completing all sets with good form.`;
}
function showExerciseHistory(code,workoutKey){
  const wk=WORKOUTS.find(x=>x.key===workoutKey);
  const rows=[];
  for(let w=1;w<=12;w++){
    const d=getProgress(w,wk.key);
    if(d[code]?.weight){
      const resolved=resolvedExercises(wk,w).find(x=>x.code===code);
      rows.push({week:w,name:resolved?resolved.name:"",weight:d[code].weight,done:d[code].checks.filter(Boolean).length});
    }
  }
  const body=rows.length?rows.map(x=>`<div class="flex justify-between py-2 border-b" style="border-color:var(--line)"><span>W${x.week} · ${esc(x.name)}</span><b>${esc(x.weight)} lb</b></div>`).join(""):`<div class="text-sm" style="color:var(--muted)">No previous weight entries yet.</div>`;
  document.body.insertAdjacentHTML("beforeend",`<div class="modal" onclick="if(event.target===this)this.remove()"><div class="sheet"><div class="flex justify-between items-center mb-3"><div class="section-title">Exercise History</div><button class="secondary" onclick="this.closest('.modal').remove()">Close</button></div>${body}</div></div>`);
}

function icon(name,size){
 size=size||18;
 const s=`width="${size}" height="${size}"`;
 const map={
  home:`<svg ${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5L12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M9.5 19.5v-6h5v6"/></svg>`,
  grid:`<svg ${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><rect x="13.5" y="13.5" width="7" height="7" rx="1"/></svg>`,
  dumbbell:`<svg ${s} viewBox="0 0 24 24" fill="currentColor"><rect x="1" y="10" width="3" height="4" rx="1"/><rect x="5" y="8" width="2.5" height="8" rx="1"/><rect x="7.5" y="11" width="9" height="2"/><rect x="16.5" y="8" width="2.5" height="8" rx="1"/><rect x="20" y="10" width="3" height="4" rx="1"/></svg>`,
  clock:`<svg ${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>`,
  info:`<svg ${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="7.5" r="0.6" fill="currentColor" stroke="none"/></svg>`,
  check:`<svg ${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>`,
  circle:`<svg ${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>`,
  download:`<svg ${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>`
 };
 return map[name]||"";
}

/* ---- Installability (Android/Chrome): capture the native prompt, expose a button ---- */
let deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",(e)=>{
 e.preventDefault();
 deferredInstallPrompt=e;
 if(typeof render==="function")render();
});
window.addEventListener("appinstalled",()=>{
 deferredInstallPrompt=null;
 if(typeof render==="function")render();
});
function installApp(){
 if(!deferredInstallPrompt)return;
 deferredInstallPrompt.prompt();
 deferredInstallPrompt.userChoice.finally(()=>{deferredInstallPrompt=null;render()});
}

function renderAdvanced(){
  const old=document.getElementById("advancedShell");
  if(old)old.remove();
  const app=document.getElementById("app");
  if(!app)return;
  const stats=calculateStats(), wi=weekInfo(state.week), workout=WORKOUTS.find(w=>w.key===state.workoutKey);
  const data=ensureProgressShape(state.week,workout);
  const done=workout.exercises.reduce((s,e)=>s+data[e.code].checks.filter(Boolean).length,0);
  const total=workout.exercises.reduce((s,e)=>s+e.sets[wi.phaseKey],0);
  const pct=total?Math.round(done/total*100):0;
  const key=`${state.week}:${state.workoutKey}`;

  const nav=`
  <nav class="fixed bottom-0 left-0 right-0 z-50 px-3 pb-3 pt-2" style="background:rgba(22,31,53,.96);border-top:1px solid var(--line);backdrop-filter:blur(10px);">
    <div class="max-w-md mx-auto grid grid-cols-5 gap-1">
    ${[
      ["home","home","Home"],["program","grid","Program"],["workout","dumbbell","Workout"],["history","clock","History"],["guide","info","Guide"]
    ].map(([k,ic,l])=>`<button onclick="switchTab('${k}')" class="tap rounded-lg py-2 flex flex-col items-center gap-0.5 ${advState.tab===k?"":"opacity-60"}" style="${advState.tab===k?"background:var(--navy2);color:var(--amber)":""}">${icon(ic,18)}<div class="text-[9px] font-bold">${l}</div></button>`).join("")}
    </div>
  </nav>`;

  let content="";
  if(advState.tab==="home"){
    content=`
    <div class="px-4 pt-5 pb-24">
      <div class="flex justify-between items-start"><div><div class="disp text-xs" style="color:var(--amber)">HYPERTROPHY LOG</div><div class="disp text-4xl">BUILD. TRACK. GROW.</div><p class="text-xs mt-2" style="color:var(--muted)">A structured 12-week hypertrophy system built around progressive overload, controlled tempo and consistent effort.</p></div><div class="streak">${stats.streak}<div class="mini-label">day streak</div></div></div>
      ${deferredInstallPrompt?`<button class="primary w-full mt-3 flex items-center justify-center gap-2" onclick="installApp()">${icon("download",16)} Install App</button>`:""}
      <div class="metric-grid mt-4">

        <div class="metric-card"><div class="mini-label">Today's progress</div><div class="metric-value">${pct}%</div><div class="progress-track mt-2"><div class="progress-fill" style="width:${pct}%"></div></div></div>
        <div class="metric-card"><div class="mini-label">Sessions logged</div><div class="metric-value">${stats.sessions}</div><div class="text-xs">completed sessions</div></div>
        <div class="metric-card"><div class="mini-label">Sets logged</div><div class="metric-value">${stats.sets}</div><div class="text-xs">total sets</div></div>
      </div>
      <div class="rounded-xl p-4 mt-4" style="background:linear-gradient(135deg,var(--navy2),#243252);border:1px solid var(--line)">
        <div class="mini-label">Next session</div><div class="section-title mt-1">${workout.full} · ${workout.name}</div><div class="text-xs mt-1" style="color:var(--muted)">${workout.focus}</div>
        <button class="primary mt-3 w-full" onclick="switchTab('workout')">Start / Continue Workout →</button>
      </div>
      <div class="section-title mt-5">Bodyweight</div>
      <div class="flex gap-2 mt-2"><input class="field" type="number" step=".1" placeholder="Current bodyweight (lb)" value="${esc(advState.bodyweight)}" onchange="logBodyweight(this.value)"></div>
      <div class="section-title mt-5">Coaching Notes</div>
      <div class="rounded-xl p-4 mt-2" style="background:var(--navy2);border:1px solid var(--line)"><div class="text-sm">Consistency beats perfect workouts. Keep most sets controlled, log the weight, and progress only when form and target reps are earned.</div></div>
    </div>`;
  } else if(advState.tab==="program"){
    content=`<div class="px-4 pt-5 pb-24"><div class="disp text-4xl">12-WEEK PROGRAM</div><p class="text-xs mt-1" style="color:var(--muted)">A progressive build from technique to peak effort, followed by a recovery week.</p>
    <div class="space-y-2 mt-4">${Array.from({length:12},(_,i)=>i+1).map(w=>{const x=weekInfo(w);return `<button onclick="setWeekDirect(${w});switchTab('workout')" class="w-full text-left rounded-xl p-3" style="background:${w===state.week?"#243252":"var(--navy2)"};border:1px solid ${w===state.week?"var(--amber)":"var(--line)"}"><div class="flex justify-between"><b>Week ${w}</b><span class="chip">${x.phaseName}</span></div><div class="text-xs mt-1" style="color:var(--muted)">${weekNoteText(w,x.phaseKey)}</div></button>`}).join("")}</div></div>`;
  } else if(advState.tab==="workout"){
    content=`<div class="px-4 pt-5 pb-24"><div class="flex justify-between items-end"><div><div class="mini-label">${workout.full}</div><div class="disp text-4xl">${workout.name}</div></div><span class="chip">${done}/${total} sets</span></div><div class="progress-track mt-3"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="flex gap-2 mt-4 overflow-x-auto pb-1">${WORKOUTS.map(w=>`<button class="secondary whitespace-nowrap ${w.key===state.workoutKey?"!border-[var(--amber)]":""}" onclick="setWorkout('${w.key}');switchTab('workout')">${w.day} · ${w.name}</button>`).join("")}</div>
    <div class="space-y-3 mt-4">${resolvedExercises(workout,state.week).map(e=>{const n=e.sets[wi.phaseKey],p=data[e.code],r=repLabel(e.range,wi.phaseKey,wi.idx),rec=getExerciseRecommendation(e,data,wi,state.week,workout.key);return `<div class="rounded-xl p-3" style="background:var(--navy2);border:1px solid ${p.checks.every(Boolean)?"var(--green)":"var(--line)"}"><div class="flex justify-between"><div><div><span style="color:var(--amber);font-weight:800">${e.code}</span> <b>${esc(e.name)}</b>${e.anchor?` <span title="Performance anchor — tracked for progress" style="color:var(--amber)">★</span>`:""}</div><div class="text-xs mt-1" style="color:var(--muted)">${n} × ${r} · tempo ${e.tempo} · RIR ${e.rir[wi.phaseKey]}</div></div><button onclick="showExerciseHistory('${e.code}','${workout.key}')" class="chip">History</button></div>
    <div class="flex items-center gap-2 mt-3"><input class="field" style="max-width:80px;text-align:center" type="number" step=".5" placeholder="lb" value="${esc(p.weight)}" oninput="setWeight('${e.code}',this.value)">${Array.from({length:n},(_,i)=>`<button onclick="toggleSet('${e.code}',${i},${e.rest})" class="tap flex-1 py-2 rounded-lg flex flex-col items-center gap-0.5" style="background:var(--navy);border:1px solid var(--line);color:${p.checks[i]?"var(--green)":"var(--muted)"}">${icon(p.checks[i]?"check":"circle",20)}<div class="text-[9px]">Set ${i+1}</div></button>`).join("")}</div><div class="text-[10px] mt-2" style="color:var(--muted)">${rec}</div><button class="text-xs mt-2" style="color:var(--amber)" onclick="toggleCue('${e.code}')">Technique cues ▾</button>${state.openCue===e.code?`<div class="mt-2 text-xs space-y-1">${e.cues.map(c=>`<div>• ${esc(c)}</div>`).join("")}</div>`:""}</div>`}).join("")}</div>
    <div id="advancedTimer">${timerBarAdvanced()}</div>
    <div class="rounded-xl p-4 mt-4" style="background:var(--navy2);border:1px solid var(--line)"><div class="mini-label">Session RPE</div><div class="flex gap-1 mt-2">${[6,7,8,9,10].map(v=>`<button class="secondary flex-1 ${String(advState.sessionRPE[key])===String(v)?"!border-[var(--amber)]":""}" onclick="setRPE(${v});renderAdvanced()">${v}</button>`).join("")}</div><textarea class="field mt-3" rows="3" placeholder="Workout notes: energy, form, pain-free/limitations, PRs..." onchange="setSessionNote(this.value)">${esc(advState.notes[key]||"")}</textarea><button class="primary mt-3 w-full" onclick="markComplete();recordCompletedSession();switchTab('history')">Finish & Log Session</button></div></div>`;
  } else if(advState.tab==="history"){
    content=`<div class="px-4 pt-5 pb-24"><div class="disp text-4xl">HISTORY & PRs</div><div class="metric-grid mt-4"><div class="metric-card"><div class="mini-label">Sessions</div><div class="metric-value">${stats.sessions}</div></div><div class="metric-card"><div class="mini-label">Sets</div><div class="metric-value">${stats.sets}</div></div></div>
    <div class="section-title mt-5">Body Measurements</div><div class="rounded-xl p-3 mt-2" style="background:var(--navy2);border:1px solid var(--line)"><div class="grid grid-cols-2 gap-2"><input id="mDate" class="field" type="date" value="${new Date().toISOString().slice(0,10)}"><input id="mWeight" class="field" type="number" step=".1" placeholder="Weight lb"><input id="mWaist" class="field" type="number" step=".1" placeholder="Waist in"></div><button class="primary mt-2 w-full" onclick="addMeasurement()">Add measurement</button>${advState.measurements.slice(0,8).map((m,i)=>`<div class="flex justify-between text-xs py-2 border-b" style="border-color:var(--line)"><span>${esc(m.date)}</span><span>${m.weight?esc(m.weight)+" lb":"—"} ${m.waist?"· "+esc(m.waist)+" in waist":""}</span><button onclick="removeMeasurement(${i})">×</button></div>`).join("")}</div>
    <div class="section-title mt-5">Completed Sessions</div><div class="space-y-2 mt-2">${advState.history.length?advState.history.slice(0,15).map(x=>`<div class="rounded-xl p-3" style="background:var(--navy2);border:1px solid var(--line)"><div class="flex justify-between"><b>W${x.week} · ${esc(x.workout)}</b><span class="pr-badge">${x.done}/${x.sets} sets</span></div><div class="text-xs mt-1" style="color:var(--muted)">${new Date(x.date).toLocaleDateString()} ${x.rpe?"· RPE "+x.rpe:""}</div></div>`).join(""):`<div class="text-sm" style="color:var(--muted)">Finish a workout and it will appear here.</div>`}</div></div>`;
  } else {
    content=`<div class="px-4 pt-5 pb-24"><div class="disp text-4xl">GUIDE</div><div class="space-y-3 mt-4">${[
      ["Progressive overload","When you hit the top of the prescribed rep range on every set with clean form, increase load next time. Small jumps are ideal."],
      ["RIR","Reps in reserve. RIR 2 means you could have done about two more good reps. Peak weeks intentionally push closer to failure."],
      ["Tempo","The first number is the lowering phase. The middle number is the pause. The final number is the lifting phase."],
      ["RPE","A 6–10 effort rating after the workout. Use it to spot patterns in recovery and performance."],
      ["Measurements","Bodyweight and waist trends are more useful than any single reading. Measure under similar conditions."],
      ["PR tracking","Use the History button on an exercise to review previous logged weights. A PR is meaningful when it comes with comparable form and reps."]
    ].map(x=>`<div class="rounded-xl p-4" style="background:var(--navy2);border:1px solid var(--line)"><b>${x[0]}</b><div class="text-xs mt-1" style="color:var(--muted)">${x[1]}</div></div>`).join("")}</div>
    <div class="grid grid-cols-2 gap-2 mt-4"><button class="secondary" onclick="exportAdvanced()">Backup / Export</button><label class="secondary text-center">Restore / Import<input type="file" accept=".json,application/json" class="hidden" onchange="importAllData(this)"></label></div><div class="text-[10px] mt-2" style="color:var(--muted)">Restore replaces the current app data on this phone. Export a fresh backup before restoring.</div>
    <div class="section-title mt-5">Reset</div>
    <div class="grid grid-cols-2 gap-2 mt-2"><button class="secondary" onclick="resetCurrentWorkout()">Reset Session</button><button class="tap py-2.5 rounded-lg text-xs font-bold" style="background:rgba(176,69,46,.12);border:1px solid rgba(176,69,46,.45);color:#df806d" onclick="resetAll()">Reset All Progress</button></div><div class="text-[10px] mt-2" style="color:var(--muted)">Reset Session clears only Week ${state.week} · ${workout.name}. Reset All wipes every week, history, and PR.</div></div>`;
  }
  const shell=document.createElement("div");shell.id="advancedShell";shell.innerHTML=content+nav;app.appendChild(shell);
}
function exportAdvanced(){
  const storage={};
  Object.keys(localStorage).filter(k=>k.startsWith("hl:")).forEach(k=>{
    try{ storage[k]=JSON.parse(localStorage.getItem(k)); }catch(e){ storage[k]=localStorage.getItem(k); }
  });
  const payload={
    program:"Hypertrophy Log",
    version:2,
    exported:new Date().toISOString(),
    storage
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="hypertrophy-log-backup.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importAllData(input){
  const file=input.files&&input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const payload=JSON.parse(reader.result);
      if(!payload||!payload.storage||typeof payload.storage!=="object")throw new Error("Invalid backup");
      if(!confirm("Restore this backup? This will replace the current Hypertrophy Log data on this phone."))return;
      Object.keys(payload.storage).filter(k=>k.startsWith("hl:")).forEach(k=>localStorage.setItem(k,JSON.stringify(payload.storage[k])));
      state.week=LS.get("hl:week",1);
      state.workoutKey=LS.get("hl:workout","upperA");
      advState={
        tab:ADV.get("hl:tab","home"),
        bodyweight:ADV.get("hl:bodyweight",""),
        measurements:ADV.get("hl:measurements",[]),
        notes:ADV.get("hl:notes",{}),
        sessionRPE:ADV.get("hl:rpe",{}),
        history:ADV.get("hl:history",[]),
        prs:ADV.get("hl:prs",{})
      };
      showToast("Backup restored");
      render();
    }catch(e){ alert("That backup file could not be restored."); }
  };
  reader.readAsText(file);
  input.value="";
}


/* The advanced shell is the single visible app UI. The original renderer remains
   available internally for data compatibility, but is never rendered alongside it. */
render = function(){
  const app=document.getElementById("app");
  if(app) app.innerHTML="";
  renderAdvanced();
};
render();
setTimeout(()=>{renderAdvanced()},0);
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}
</script>
